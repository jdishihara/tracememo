name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: Build the synthetic drone example
        run: |
          tracememo synth drone --out data/synthetic/drone --seed 0
          tracememo build --config examples/drone_memo/project.yaml
          test -s examples/drone_memo/build/report.md
          test -s examples/drone_memo/build/values.tex
