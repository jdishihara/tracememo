[project]
name = "tracememo"
version = "0.1.0"
description = "Turn raw experiment output into technical reports where every number is linked to the code and data that produced it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6",
    "pymavlink>=2.4",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
tracememo = "tracememo.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tracememo*"]

[tool.setuptools.package-data]
tracememo = ["report/templates/*", "report/*.mplstyle", "draft/prompts/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:tracememo.*"]
